<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jerovia · Bitácora</title>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
:root{--a:#fff0f4;--b:#ffd9e2;--c:#ffb6c8;--d:#e8899f;--o:#b9798a;--t:#5a3a44}
*{box-sizing:border-box;margin:0}
body{font-family:'Cormorant Garamond',Georgia,serif;background:#fdf6f8;color:var(--t);font-size:19px;line-height:1.35}
button,input,textarea,select{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr 230px;min-height:100vh}
aside{padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:#fff}
aside img{width:100%;max-width:140px;margin:0 auto 12px;display:block}
.nv{border:0;background:none;text-align:left;padding:11px 16px;border-radius:20px;cursor:pointer;display:flex;gap:10px;align-items:center}
.nv.on{background:linear-gradient(90deg,var(--b),var(--c));font-weight:700}
.nv:hover{background:var(--a)}
main{padding:16px 22px;min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.top input{flex:1;padding:12px 18px;border-radius:20px;border:0;background:#fff}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--b);cursor:pointer;position:relative;flex:none}
.ib i{position:absolute;top:-4px;right:-4px;background:var(--d);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;font-style:normal}
.card{background:#fff;border-radius:24px;padding:18px;margin-bottom:14px}
.hero{background:var(--b);border-radius:36px;padding:26px;display:flex;justify-content:center;gap:28px;align-items:center;flex-wrap:wrap}
.hero img{height:150px;border-radius:14px}
.btn{background:var(--c);border:0;border-radius:18px;padding:8px 18px;cursor:pointer;color:#fff;font-weight:700;margin:4px 4px 0 0}
.btn.g{background:var(--b);color:var(--o)}
.side{padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.chip{background:var(--b);border:0;border-radius:22px;padding:18px;text-align:left;cursor:pointer}
.chip:hover{background:var(--c)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--b);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--o);overflow:hidden;flex:none}
.rx{border:1px solid var(--b);background:#fff;border-radius:14px;padding:1px 9px;cursor:pointer}
.rx.on{background:var(--b)}
.bd{font-size:14px;background:var(--a);color:var(--o);border-radius:10px;padding:1px 8px;margin-right:4px}
.modal{position:fixed;inset:0;background:#5a3a4455;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal>div{background:#fff;border-radius:24px;padding:22px;max-width:430px;width:100%;max-height:88vh;overflow:auto}
input,textarea,select{border:1px solid var(--b);border-radius:14px;padding:8px 12px;width:100%;background:#fff;margin:4px 0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}.pimgs img{width:100%;border-radius:14px}
.cm{background:var(--a);border-radius:14px;padding:6px 12px;margin-top:6px;font-size:17px}
.tab{border:0;background:none;cursor:pointer;padding:4px 6px;font-weight:700}.tab.on{border-bottom:3px solid var(--c)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--a);border-radius:12px;min-height:62px;padding:4px;font-size:14px;overflow:hidden}
.cal em{display:block;background:var(--c);color:#fff;border-radius:8px;padding:0 5px;margin-top:2px;font-style:normal;cursor:pointer}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:fixed;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:5;padding:6px;border-radius:22px 22px 0 0;box-shadow:0 -4px 16px #f3c9d466}aside img,aside .sp{display:none}.nv{flex-direction:column;font-size:12px;padding:6px 10px;gap:0;white-space:nowrap}main{padding:12px 12px 96px}.side{flex-direction:row;order:-1;padding:12px 12px 0}.side .chip{flex:1;padding:10px;text-align:center;font-size:15px}.hero img{height:100px}.un{display:none}}
<style>

body,button,input,textarea,select,h2,h3,.btn,.chip,.tab{font-family:'Century Gothic',CenturyGothic,'Questrial','Avant Garde',sans-serif}
h2,h3{font-weight:600;color:#d46a8c}
aside{background:#ffffffd9;backdrop-filter:blur(8px);margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:30px;border:2px solid #fff;box-shadow:0 8px 28px #f2a7bf40}
.card{background:#ffffffe8;border:2px solid #fff;border-radius:26px;box-shadow:0 6px 20px #f2a7bf33}
.btn{background:linear-gradient(#ffc3d3,#f59ab4);border-radius:999px;font-weight:500;box-shadow:inset 0 2px 0 #fff9,0 3px 8px #f59ab455}
.btn.g{background:linear-gradient(#fff,#ffe3ea);color:#c4708a;box-shadow:inset 0 -2px 0 #ffc6d5}
.nv{border-radius:999px;font-weight:600}
.nv.on{background:linear-gradient(#ffd0dc,#ffb0c5);box-shadow:inset 0 2px 0 #fff9;color:#8a3b57}
.chip{background:linear-gradient(#fff,#ffe3ea);border:2px solid #fff;border-radius:26px;box-shadow:0 6px 16px #f2a7bf40;font-size:17px;color:#a8506c}
.ib{border-radius:50%;background:linear-gradient(#fff,#ffd9e2);box-shadow:0 3px 10px #f2a7bf50}
.top input{border-radius:999px;box-shadow:0 4px 14px #f2a7bf30;border:2px solid #fff}
.hero{background:linear-gradient(135deg,#ffe3ec,#ffc9d9 60%,#ffe8d4);position:relative;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 24px #f2a7bf44}
.rx,.bd,.cm{border-radius:999px}.cm{border-radius:16px}
@media(max-width:860px){aside{margin:0;height:auto;border-radius:22px 22px 0 0}}

const save=()=>{if(!ready||!me)return;const m=docsOf();for(const p in m){const j=JSON.stringify(m[p]);if(last[p]!==j){last[p]=j;FB.set(p,JSON.parse(j)).catch(e=>alert('No se pudo guardar ('+(e.code||e.message)+')'))}}for(const p in last)if(!m[p]){delete last[p];FB.del(p).catch(()=>{})}};
const LOAD='<p style="padding:40px;text-align:center">Cargando…</p>';
function stopSubs(){subs.forEach(f=>f());subs=[];last={};db={users:[],posts:[],notes:[],links:[],ev:[],rules:R,pins:[]}}
function startSubs(){stopSubs();const rr=()=>{if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName)||$('#m').innerHTML)return;render()};
COLS.forEach(k=>subs.push(FB.subC(k,a=>{db[k]=a;for(const p in last)if(p.startsWith(k+'/'))delete last[p];a.forEach(x=>last[k+'/'+x.id]=JSON.stringify(x));if(k==='users')a.forEach(u=>last['login/'+u.id]=JSON.stringify(lg(u)));rr()})));
subs.push(FB.subD('meta/rules',d=>{db.rules=d?d.t:R;last['meta/rules']=JSON.stringify({id:'rules',t:db.rules});rr()}))}
window.onUser=async u=>{if(!u){stopSubs();me=null;ready=1;render();return}
try{const a=await FB.get('auth/'+u.uid);if(!a){alert('Tu cuenta todavía no está configurada. Avisá a las moderadoras.');FB.out();return}me=a.u;myUid=u.uid;v='wel';ready=1;startSubs();render()}catch(e){ready=1;alert('Error de conexión ('+(e.code||e.message)+')');render()}};
const U=i=>db.users.find(u=>u.id===i),allP=()=>[...DEF,...db.pins];
const av=(a,s=44)=>a.av?`<img class=av style="width:${s}px;height:${s}px" src="${a.av}">`:`<span class=av style="width:${s}px;height:${s}px;font-size:${s/2.4}px">${esc(a.name[0])}</span>`;
const bdg=a=>(a.mod?'<span class=bd>Moderadora</span>':'')+a.rl.map(r=>`<span class=bd>${esc(r)}</span>`).join('');
const pv=(p,s=84)=>p.img?`<img src="${p.img}" style="width:${s}px">`:`<div style="width:${s}px;margin:auto">${p.svg}</div>`;
const fd=t=>new Date(t).toLocaleString('es-PY',{dateStyle:'short',timeStyle:'short'});
const note=(to,x)=>{if(to!==me)db.notes.push({id:uid(),to,x,t:Date.now(),r:0})};
const rd=(f,m=720,t='image/jpeg')=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(t,.6))};i.onerror=()=>r(null);i.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
const go=x=>{v=x;render();scrollTo(0,0)};
const modal=h=>{$('#m').innerHTML=`<div class=modal onclick="if(event.target===this)cl()"><div>${h}</div></div>`};
const cl=()=>$('#m').innerHTML='';
window.alert=x=>modal(`<p>${esc(x)}</p><br><button class=btn onclick=cl()>Ok</button>`);
function ask(t,ph,cb){modal(`<h3>${t}</h3><input id=ak placeholder="${ph}" onkeydown="if(event.key==='Enter')akOK()"><button class=btn onclick=akOK()>Aceptar</button><button class="btn g" onclick=cl()>Cancelar</button>`);window.akOK=()=>{const x=$('#ak').value.trim();cl();if(x)cb(x)}}
function yn(t,cb){modal(`<h3>${t}</h3><button class=btn onclick=ynOK()>Sí</button><button class="btn g" onclick=cl()>No</button>`);window.ynOK=()=>{cl();cb()}}
const NAV=[['wel','🌸','¡bienvenida!'],['fyp','🏠','for you page'],['her','👭','hermanas'],['foro','💬','foro'],['pics','📷','pics'],['lnk','🔗','links']];

function login(){if(location.hash==='#setup')return $('#root').innerHTML=`<div class=card style="max-width:420px;margin:40px auto;text-align:center"><h2>Configuración inicial</h2><p>Crea las 15 cuentas. Se hace una sola vez.</p><button class=btn onclick=setup()>Crear cuentas</button></div>`;
$('#root').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:14px"><div class=card style="width:min(390px,100%);text-align:center"><div class=hero style="padding:14px;border-radius:28px"><img style="height:90px" src="${LJ}"><img style="height:90px" src="${LO}"></div><h2 style="margin:12px 0">Bitácora de Jerovia</h2><select id=ln></select><input id=lp type=password placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"><button class=btn onclick=doLogin()>Ingresar</button><p id=le style="color:#c0486a"></p></div></div>`;
FB.list('login').then(l=>{const s=$('#ln');if(s)s.innerHTML=l.filter(x=>!x.off).sort((a,b)=>a.n.localeCompare(b.n,'es')).map(x=>`<option value="${esc(x.e)}">${esc(x.n)}</option>`).join('')}).catch(()=>{})}
function doLogin(){FB.login($('#ln').value,$('#lp').value+PAD).catch(()=>$('#le').textContent='Contraseña incorrecta. Probá de nuevo.')}

function render(){if(!ready||(me&&!U(me)))return $('#root').innerHTML=LOAD;if(!me)return login();if(U(me).off){FB.out();return}const u=U(me),nn=db.notes.filter(n=>n.to===me&&!n.r).length;
$('#root').innerHTML=`<div id=app><aside><img src="${LJ}">${NAV.map(n=>`<button class="nv ${v===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} <span>${n[2]}</span></button>`).join('')}<div class=sp style="flex:1"></div><button class="nv ${v==='p:'+me?'on':''}" onclick="go('p:'+me)">👤 <span>mi perfil</span></button><button class=nv onclick=askOut()>🚪 <span>cerrar sesión</span></button></aside>
<main><div class=top><input id=q placeholder="Buscar palabra clave" onkeydown="if(event.key==='Enter'&&this.value.trim())go('s:'+this.value.trim())"><button class=ib title="Mural" onclick="go('foro')">💬</button><button class=ib title="Notificaciones" onclick=showN()>🔔${nn?`<i>${nn}</i>`:''}</button><span class=un>${esc(u.name)}</span><span onclick="go('p:'+me)" style="cursor:pointer">${av(u,40)}</span></div>${body()}</main>
<div class=side><button class=chip onclick="go('bday')">🎂 Jero cumpleaños</button><button class=chip onclick="go('cal')">📅 Calendario</button><button class=chip onclick="go('pins')">📌 Pines</button></div></div>`}

const postH=p=>{const a=U(p.u),isM=U(me).mod;const em=[...new Set(['💗','🌈','👍','😢',...Object.keys(p.rx)])];
return `<div class=card><div style="display:flex;gap:10px;align-items:center">${av(a)}<div><b style="cursor:pointer" onclick="go('p:${a.id}')">${esc(a.name)}</b><br><small>${fd(p.t)} · ${p.k==='pic'?'pics':'foro'}</small></div>${p.u===me||isM?`<button class="btn g" style="margin-left:auto" onclick="delP('${p.id}')">Borrar</button>`:''}</div>${p.x?`<p style="margin:10px 0;white-space:pre-wrap">${esc(p.x)}</p>`:''}${p.im.length?`<div class=pimgs style="margin:8px 0">${p.im.map(i=>`<img src="${i}">`).join('')}</div>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${em.map(e=>{const l=p.rx[e]||[];return `<button class="rx ${l.includes(me)?'on':''}" data-e="${e}" onclick="rx('${p.id}',this.dataset.e)">${e}${l.length?' '+l.length:''}</button>`}).join('')}<button class=rx onclick="rxN('${p.id}')">＋</button></div>${p.c.map(c=>`<div class=cm><b>${esc(U(c.u)?.name)}</b> ${esc(c.x)}</div>`).join('')}<input id="c${p.id}" placeholder="Responder..." onkeydown="if(event.key==='Enter')rep('${p.id}')"></div>`};
const list=a=>a.length?a.sort((x,y)=>y.t-x.t).map(postH).join(''):'<div class=card>Todavía no hay publicaciones. ¡Escribí la primera!</div>';

function body(){const u=U(me),isM=u.mod;
if(v==='wel')return `<div class=hero><img src="${LJ}"><img src="${LO}"></div><div class=card style="margin-top:16px"><h2>¡Hola ${esc(u.name)}!</h2><p>Estas son las reglas que debes conocer antes de publicar en la página....</p><p style="white-space:pre-wrap;margin:10px 0">${esc(db.rules)||'<i>Aún no hay reglas cargadas.</i>'}</p>${isM?'<button class=btn onclick=editRules()>Editar reglas</button>':''}</div>${u.fp?'<div class=card>🔒 Cambiá tu contraseña en Mi perfil → Edit profile.</div>':''}`;
if(v==='fyp')return '<h2>For you page</h2><br>'+list([...db.posts]);
if(v==='her')return `<h2>Hermanas</h2><br>${isM?'<button class=btn onclick=addSis()>Agregar hermana</button><br><br>':''}<div class=gr>${[...db.users].sort(cmp).map(a=>`<div class=card style="text-align:center;margin:0;cursor:pointer" onclick="go('p:${a.id}')">${av(a,70)}<p><b>${esc(a.name)}</b></p><div>${bdg(a)}</div></div>`).join('')}</div>`;
if(v==='foro')return `<h2>Foro</h2><br><div class=card><textarea id=fx rows=3 placeholder="Escribí lo que quieras compartir (solo texto y emojis)"></textarea><button class=btn onclick=postF()>Publicar</button></div>`+list(db.posts.filter(p=>p.k==='foro'));
if(v==='pics')return `<h2>Pics</h2><br><div class=card><input id=pf type=file accept="image/*" multiple><textarea id=px rows=2 placeholder="Pie de foto (opcional)"></textarea><small>Obligatorio: de 1 a 5 imágenes.</small><br><button class=btn onclick=postP()>Publicar</button></div>`+list(db.posts.filter(p=>p.k==='pic'));
if(v==='lnk')return `<h2>Links</h2><br>${db.links.map(l=>`<div class=card style="display:flex;gap:10px;align-items:center"><a href="${esc(l.u)}" target=_blank rel=noopener style="color:var(--o);font-weight:700;flex:1">🔗 ${esc(l.t)}</a>${isM?`<button class="btn g" onclick="delL('${l.id}')">Quitar</button>`:''}</div>`).join('')||'<div class=card>Aún no hay links.</div>'}${isM?'<button class=btn onclick=addL()>Agregar link</button>':''}`;
if(v==='bday'){const ms=new Date(2026,bm,1).toLocaleString('es',{month:'long'}),bs=db.users.filter(a=>a.bd&&+a.bd.split('-')[1]-1===bm).sort((x,y)=>x.bd.slice(8)-y.bd.slice(8));return `<h2>Jero cumpleaños</h2><br><div class=card style="text-align:center"><button class="btn g" onclick="bm=(bm+11)%12;render()">‹</button> <b style="text-transform:capitalize;font-size:22px">${ms}</b> <button class="btn g" onclick="bm=(bm+1)%12;render()">›</button>${bs.map(a=>`<p style="margin-top:10px">🎂 <b>${esc(a.name)}</b> — día ${+a.bd.slice(8)}</p>`).join('')||'<p style="margin-top:10px">Nadie cumple años este mes.</p>'}</div><small>Cada hermana carga su fecha en Edit profile.</small>`}
if(v==='cal'){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<span></span>';for(let d=1;d<=n;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;c+=`<div ${isM?`onclick="addE('${k}')" style="cursor:pointer"`:''}>${d}${db.ev.filter(e=>e.d===k).map(e=>`<em onclick="event.stopPropagation();delE('${e.id}')">${esc(e.t)}</em>`).join('')}</div>`}
return `<h2>Calendario</h2><br><div class=card><div style="text-align:center;margin-bottom:10px"><button class="btn g" onclick="cm=new Date(y0(),m0()-1,1);render()">‹</button> <b style="text-transform:capitalize;font-size:22px">${cm.toLocaleString('es',{month:'long',year:'numeric'})}</b> <button class="btn g" onclick="cm=new Date(y0(),m0()+1,1);render()">›</button></div><div class=cal>${c}</div></div>${isM?'<small>Moderadoras: tocá un día para agregar una actividad; tocá una actividad para borrarla.</small>':''}`}
if(v==='pins')return `<h2>Pines</h2><br><div class=gr>${allP().map(p=>{const o=u.pn.includes(p.id);return `<div class=card style="text-align:center;margin:0;cursor:pointer" onclick="pinM('${p.id}')"><div style="${o?'':'filter:grayscale(1);opacity:.45'}">${pv(p)}</div><p><b>${esc(p.n)}</b></p><small>${o?'✅ Obtenido':'🔒 No obtenido'}</small></div>`}).join('')}</div>${isM?'<br><button class=btn onclick=newPin()>Subir pin PNG</button>':''}`;
if(v[0]==='s')return `<h2>Resultados para “${esc(v.slice(2))}”</h2><br>`+list(db.posts.filter(p=>(p.x+p.c.map(c=>c.x).join(' ')+U(p.u).name).toLowerCase().includes(v.slice(2).toLowerCase())));
if(v[0]==='p'){const a=U(v.slice(2));return `<div class=card style="text-align:center;padding:0 0 18px;overflow:hidden"><div style="height:110px;background:var(--b)"></div><div style="margin-top:-55px">${av(a,110)}</div><h2>${esc(a.name)}</h2><div>${bdg(a)}</div><p style="margin:10px 24px;white-space:pre-wrap">${esc(a.bio)}</p><p><b>Cargo actual:</b> ${esc(a.cg)||'—'}</p><p><b>Grado:</b> ${grd(a)}</p>${a.id===me?'<button class="btn g" onclick=editMe()>Edit profile</button>':''}${isM?`<button class="btn g" onclick="manU('${a.id}')">Gestionar</button>`:''}<div style="margin-top:14px"><button class="tab ${tab==='p'?'on':''}" onclick="tab='p';render()">post's</button> <button class="tab ${tab==='n'?'on':''}" onclick="tab='n';render()">pines</button></div></div>${tab==='p'?list(db.posts.filter(p=>p.u===a.id)):`<div class=gr>${a.pn.map(i=>allP().find(p=>p.id===i)).filter(Boolean).map(p=>`<div class=card style="text-align:center;margin:0">${pv(p,70)}<small>${esc(p.n)}</small></div>`).join('')||'<div class=card>Aún no tiene pines.</div>'}</div>`}`}}
const y0=()=>cm.getFullYear(),m0=()=>cm.getMonth();

const find=i=>db.posts.find(p=>p.id===i);
function rx(i,e){const p=find(i),l=p.rx[e]=p.rx[e]||[],k=l.indexOf(me);if(k<0){l.push(me);note(p.u,`${U(me).name} reaccionó ${e} a tu publicación`)}else l.splice(k,1);if(!l.length)delete p.rx[e];save();render()}
function rxN(i){ask('Reaccionar con otro emoji','Pegá o escribí un emoji',e=>rx(i,e))}
function rep(i){const x=$('#c'+i).value.trim();if(!x)return;const p=find(i);p.c.push({u:me,x,t:Date.now()});note(p.u,`${U(me).name} respondió a tu publicación`);save();render()}
function delP(i){yn('¿Borrar esta publicación?',()=>{db.posts=db.posts.filter(p=>p.id!==i);save();render()})}
function postF(){const x=$('#fx').value.trim();if(!x)return;db.posts.push({id:uid(),u:me,k:'foro',x,im:[],rx:{},c:[],t:Date.now()});save();render()}
async function postP(){const f=[...$('#pf').files];if(!f.length||f.length>5)return alert('Elegí entre 1 y 5 imágenes.');const im=(await Promise.all(f.map(x=>rd(x)))).filter(Boolean);if(im.length<f.length)return alert('No pude leer alguna imagen. Usá fotos JPG o PNG.');db.posts.push({id:uid(),u:me,k:'pic',x:$('#px').value.trim(),im,rx:{},c:[],t:Date.now()});save();render()}
function editRules(){modal(`<h3>Reglas</h3><textarea id=ru rows=10>${esc(db.rules)}</textarea><button class=btn onclick="db.rules=$('#ru').value;save();cl();render()">Guardar</button><button class="btn g" onclick=cl()>Cancelar</button>`)}
function addL(){ask('Título del link','Ej: Formulario de inscripción',t=>setTimeout(()=>ask('Dirección del link','https://...',u=>{db.links.push({id:uid(),t,u:/^https?:/.test(u)?u:'https://'+u});save();render()}),0))}
function delL(i){db.links=db.links.filter(l=>l.id!==i);save();render()}
function addE(d){ask('Actividad para el '+d.split('-').reverse().join('/'),'Nombre de la actividad',t=>{db.ev.push({id:uid(),d,t});save();render()})}
function delE(i){yn('¿Borrar esta actividad?',()=>{db.ev=db.ev.filter(e=>e.id!==i);save();render()})}
function showN(){const l=db.notes.filter(n=>n.to===me).sort((a,b)=>b.t-a.t).slice(0,30);modal(`<h3>Notificaciones</h3>${l.map(n=>`<div class=cm>${esc(n.x)}<br><small>${fd(n.t)}</small></div>`).join('')||'<p>No tenés notificaciones.</p>'}<br><button class=btn onclick=cl()>Cerrar</button>`);l.forEach(n=>n.r=1);save();setTimeout(render,0)}
function askOut(){modal(`<h3>¿Cerrar sesión?</h3><button class=btn onclick="cl();FB.out()">Sí, quiero cerrar sesión</button><button class="btn g" onclick=cl()>No quiero cerrar sesión</button>`)}
function pinM(i){const p=allP().find(x=>x.id===i),o=U(me).pn.includes(i);modal(`<div style="text-align:center">${pv(p,110)}<h3>${esc(p.n)}</h3><p>${o?'✅ Obtenido':'🔒 No obtenido'}</p></div><p><b>Requisitos:</b></p><ul style="margin-left:20px">${p.r.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><br><button class=btn onclick=cl()>Cerrar</button>`)}
function newPin(){modal(`<h3>Nuevo pin</h3><input id=pn placeholder="Nombre del pin"><textarea id=pr rows=4 placeholder="Requisitos (uno por línea)"></textarea><input id=pg type=file accept="image/png"><button class=btn onclick=savePin()>Agregar pin</button><button class="btn g" onclick=cl()>Cancelar</button>`)}
async function savePin(){const f=$('#pg').files[0],n=$('#pn').value.trim();if(!f||!n)return alert('Poné un nombre y una imagen PNG.');db.pins.push({id:uid(),n,r:$('#pr').value.split('\n').filter(Boolean),img:await rd(f,300,'image/png')});save();cl();render()}
function editMe(){const u=U(me);modal(`<h3>Editar perfil</h3>Nombre<input id=en value="${esc(u.name)}">Biografía (máx. 500)<textarea id=eb rows=4 maxlength=500>${esc(u.bio)}</textarea>Cumpleaños<input id=ed type=date value="${u.bd}">Foto de perfil<input id=ef type=file accept="image/*">Nueva contraseña (opcional)<input id=ep type=password><button class=btn onclick=saveMe()>Guardar</button><button class="btn g" onclick=cl()>Cancelar</button>`)}
async function saveMe(){const u=U(me),f=$('#ef').files[0],p=$('#ep').value;if(p&&p.length<3)return alert('La contraseña debe tener al menos 3 caracteres.');u.name=$('#en').value.trim()||u.name;u.bio=$('#eb').value;u.bd=$('#ed').value;if(f){const d=await rd(f,300);if(!d)return alert('No pude leer esa imagen. Probá con JPG o PNG.');u.av=d}if(p){try{await FB.pw(p+PAD);u.fp=0}catch(e){return alert('Para cambiar la contraseña, cerrá sesión, volvé a entrar y probá de nuevo.')}}save();cl();render()}
function manU(i){const a=U(i);modal(`<h3>Gestionar a ${esc(a.name)}</h3>Nombre<input id=mn value="${esc(a.name)}">Cumpleaños<input id=mb type=date value="${a.bd}">Cargo actual<input id=mc value="${esc(a.cg)}">Grado<select id=mg><option value="">Sin grado</option>${['rojo','verde','violeta'].map(g=>`<option ${a.gr===g?'selected':''}>${g}</option>`).join('')}</select><button class="btn g" onclick="resetPw('${i}')">Restablecer contraseña a 123</button><br><label><input type=checkbox id=mo ${a.off?'checked':''} style="width:auto"> Cuenta desactivada</label><label><input type=checkbox id=mm ${a.mod?'checked':''} style="width:auto"> Moderadora</label><p><b>Roles</b></p>${ROLES.map((r,k)=>`<label><input type=checkbox class=mr value="${r}" ${a.rl.includes(r)?'checked':''} style="width:auto"> ${r}</label><br>`).join('')}<p><b>Pines</b></p>${allP().map(p=>`<label><input type=checkbox class=mpn value="${p.id}" ${a.pn.includes(p.id)?'checked':''} style="width:auto"> ${esc(p.n)}</label><br>`).join('')}<br><button class=btn onclick="saveU('${i}')">Guardar</button><button class="btn g" onclick=cl()>Cancelar</button>`)}
function saveU(i){const a=U(i);a.name=$('#mn').value.trim()||a.name;a.bd=$('#mb').value;a.cg=$('#mc').value.trim();a.gr=$('#mg').value;a.off=$('#mo').checked;{const m=$('#mm').checked;if(m!==a.mod)FB.set('auth/'+a.uid,{id:a.uid,u:a.id,mod:m});a.mod=m}a.rl=[...document.querySelectorAll('.mr:checked')].map(x=>x.value);a.pn=[...document.querySelectorAll('.mpn:checked')].map(x=>x.value);save();cl();render()}
function addSis(){ask('Nombre y apellido de la nueva hermana','Ej: María Pérez',async n=>{const id='u'+uid(),em=id+'-1@jerovia.app';try{const x=await FB.mk(em,'123'+PAD);await FB.set('auth/'+x,{id:x,u:id,mod:false});db.users.push({id,name:n,mod:false,bio:'',av:'',bd:'',rl:[],pn:[],cg:'',gr:'',em,uid:x,v:1,fp:1,off:false});save();render();alert('Cuenta creada. Contraseña inicial: 123')}catch(e){alert('No se pudo crear ('+(e.code||e.message)+')')}})}
